services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:///./data/python_mastery.db
      JWT_SECRET: ${JWT_SECRET:-local-python-mastery-dev-secret-change-me}
      LOCAL_ONLY_EXECUTION: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-local-python-mastery-dev-secret-change-me}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
